name: Supabase Keep Alive

on:
  schedule:
    # Every 3 days at 02:00 UTC (10:00 UTC+8)
    - cron: "0 2 */3 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase comments
        env:
          SUPABASE_URL: https://cqvcepicdxkklfnumxsw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_CAUT1Vmjl1NVm1s6lTbH1g_Uu76yF5U
        run: |
          set -euo pipefail

          response="$(
            curl --fail-with-body --silent --show-error               --retry 3 --retry-delay 5               --get "$SUPABASE_URL/rest/v1/comments"               --data-urlencode "select=id"               --data-urlencode "limit=1"               -H "apikey: $SUPABASE_PUBLISHABLE_KEY"               -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY"
          )"

          echo "Supabase query succeeded: $response"
