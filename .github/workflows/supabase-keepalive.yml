name: Supabase Keep Alive

on:
  schedule:
    # Every 6 hours, away from the busy top of the hour.
    # China time: 02:17, 08:17, 14:17, 20:17 (actual start may be delayed).
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-keepalive.yml
      - scripts/supabase_keepalive.py
      - tests/test_keepalive.py
      - hugo.toml

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read repository configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check failure handling
        run: python3 -m unittest discover -s tests -p 'test_keepalive.py'
      - name: Query database and check login service
        run: python3 scripts/supabase_keepalive.py
