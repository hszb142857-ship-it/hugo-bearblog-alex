baseURL = "/"
title = "陆寒水的博客"

# 加载 Bear 极简主题
[module]
  [[module.imports]]
    path = "github.com/janraasch/hugo-bearblog"

[params]
  # 告诉系统：首页要自动展示 blog 文件夹里的文章列表
  mainSections = ["blog"]
  custom_css = ["custom.css"]
  # 强制关闭暗色模式，永远保持米白/浅色复古纸质风格
  title = "你的博客名称"
  # 加这一行导入 custom.css，这是 bearblog 官方支持的最稳妥方式！
  custom_head = '<link rel="stylesheet" href="/custom.css">'

# 加上顶部的导航菜单，方便点击跳转
[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "所有文章"
    url = "/blog/"
    weight = 2

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # 允许在文章里使用 HTML 魔法！

# 开启 Git 信息读取
enableGitInfo = true

# 自定义时间显示格式（精确到小时和分钟，例如：2026-09-22 14:30）
[frontmatter]
  lastmod = [":git", "lastmod", "date"]
