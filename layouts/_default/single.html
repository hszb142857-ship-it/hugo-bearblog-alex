{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>

  <div class="post-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">
      {{ .Date.Format "2006-01-02" }}
    </time>
    {{ if ne .Lastmod .Date }}
      <span aria-hidden="true"> · </span>
      <span>更新于 {{ .Lastmod.Format "2006-01-02 15:04" }}</span>
    {{ end }}
  </div>

  {{ .Content }}
</article>
{{ end }}
