{{ define "main" }}
<article>
  <h1 style="margin-bottom: 0.2rem;">{{ .Title }}</h1>
  
  <p style="font-size: 0.85em; color: #8b3a3a; margin-top: 0.4rem; margin-bottom: 1.8rem; opacity: 0.9;">
    📅 发布于：{{ .Date.Format "2006-01-02" }}
    {{ if ne .Lastmod .Date }}
      &nbsp;|&nbsp; 📝 最后一改：{{ .Lastmod.Format "2006-01-02 15:04" }}
    {{ end }}
  </p>

  {{ .Content }}
</article>
{{ end }}
