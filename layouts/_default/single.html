{{ define "main" }}
<article>
  <h1 style="margin-bottom: 0.2em;">{{ .Title }}</h1>
  
  <p style="color: #8b3a3a; font-size: 0.85em; margin-top: 0.5em; margin-bottom: 1.8em; opacity: 0.85;">
    📅 发布于：{{ .Date.Format "2006-01-02" }}
    {{ if ne .Lastmod .Date }}
      &nbsp;|&nbsp; 📝 最后一改：{{ .Lastmod.Format "2006-01-02 15:04" }}
    {{ end }}
  </p>

  {{ .Content }}
</article>
{{ end }}
