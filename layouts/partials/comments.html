{{- if and .Site.Params.comments.enabled .Site.Params.comments.supabase_url .Site.Params.comments.supabase_publishable_key -}}
<section
  class="comments"
  data-comments
  data-supabase-url="{{ .Site.Params.comments.supabase_url }}"
  data-supabase-key="{{ .Site.Params.comments.supabase_publishable_key }}"
  data-page-path="{{ .RelPermalink }}"
>
  <div class="comments-heading">
    <h2>💬 留言</h2>
    <p>留言经过审核后才会公开。</p>
  </div>

  <div class="comments-login" data-comments-login>
    <button type="button" class="comments-google-button" data-google-login>
      使用 Google 账号登录
    </button>
  </div>

  <div class="comments-user" data-comments-user hidden>
    <div class="comments-userbar">
      <span data-comments-user-name></span>
      <button type="button" class="comments-signout" data-google-logout>退出登录</button>
    </div>

    <form class="comments-form" data-comments-form>
      <label for="comment-content-{{ anchorize .RelPermalink }}">留言内容</label>
      <textarea
        id="comment-content-{{ anchorize .RelPermalink }}"
        name="content"
        rows="5"
        maxlength="2000"
        placeholder="写下你的想法……"
        required
      ></textarea>
      <div class="comments-form-footer">
        <span class="comments-hint">提交后等待审核。</span>
        <button type="submit">提交留言</button>
      </div>
    </form>
  </div>

  <div class="comments-status" data-comments-status role="status" aria-live="polite"></div>
  <div class="comments-list" data-comments-list></div>
</section>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="{{ "comments.js" | relURL }}"></script>
{{- end -}}
